# ─────────────────────────────────────────────────────────────
# ChatMatch – Demo nhiều instance với Redis Pub/Sub
#
#   Trình duyệt ──► nginx (:8080) ──┬──► chat1 (:3001) ─┐
#                                   └──► chat2 (:3001) ─┴──► redis (:6379)
#
# Chạy:   docker compose up --build
# Mở:     http://localhost:8080
# Xem chi tiết: docs/DOCKER.md
# ─────────────────────────────────────────────────────────────

x-chat-common: &chat-common
  build: .
  init: true
  restart: unless-stopped
  environment:
    PORT: "3001"
    USE_REDIS: "true"
    REDIS_URL: "redis://redis:6379"
    # Không đặt NODE_ENV=production khi demo: chế độ đó bật DISALLOW_SAME_DEVICE,
    # khiến 2 tab cùng trình duyệt không thể ghép cặp với nhau.
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379" # Mở ra host để soi bằng redis-cli; bỏ dòng này nếu không cần
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chat1:
    <<: *chat-common
    ports:
      - "3001:3001" # Truy cập thẳng instance 1 (bỏ qua load balancer)

  chat2:
    <<: *chat-common
    ports:
      - "3002:3001" # Truy cập thẳng instance 2

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      chat1:
        condition: service_healthy
      chat2:
        condition: service_healthy

