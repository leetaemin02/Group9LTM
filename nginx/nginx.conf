# Load balancer cho ChatMatch – hỗ trợ nâng cấp WebSocket
# Round-robin: các kết nối lần lượt rơi vào chat1 / chat2,
# nên 2 người dùng thường nằm ở 2 instance khác nhau → minh họa Redis Pub/Sub.

upstream chatmatch {
    server chat1:3001;
    server chat2:3001;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    location / {
        proxy_pass http://chatmatch;
        proxy_http_version 1.1;

        # Bắt buộc để nâng cấp HTTP → WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        # Ghi đè (không nối thêm) để client không giả mạo IP;
        # server.js dùng header này cho giới hạn kết nối theo IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Giữ kết nối WebSocket lâu (server ping mỗi 30s)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

